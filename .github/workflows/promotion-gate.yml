name: Immutable Image Promotion Gate

on:
  workflow_dispatch:
    inputs:
      approved_uat_image:
        description: UAT-approved image reference ending in @sha256:<digest>
        required: true
        type: string
      production_candidate_image:
        description: Production candidate image reference ending in @sha256:<digest>
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-identical-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout promotion verifier
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.14.0

      - name: Reject rebuilds and mutable tags
        run: >-
          node scripts/verify-image-promotion.mjs
          '${{ inputs.approved_uat_image }}'
          '${{ inputs.production_candidate_image }}'
