name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  typecheck-and-build:
    name: Type Check & Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API types from staging
        run: pnpm gen:api:staging
        env:
          OPENAPI_URL: ${{ secrets.STAGING_OPENAPI_URL || 'https://api-staging.adcendy.com/api/docs-json' }}

      - name: Type check
        run: pnpm typecheck

      - name: Check for uncommitted generated files
        run: |
          if ! git diff --exit-code src/generated/openapi.ts; then
            echo "❌ Error: Generated API types are out of sync!"
            echo "Please run 'pnpm gen:api' and commit the changes."
            exit 1
          fi
        continue-on-error: false

      - name: Lint
        run: pnpm lint
        continue-on-error: true

      - name: Build application
        run: pnpm build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api-staging.adcendy.com
          NEXT_PUBLIC_DATA_SOURCE: real

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build
          path: .next
          retention-days: 7
