version: 1
status: implementation-ready

backend:
  files_revision: "79324473cab50871875fc8c7472c440125b277a9"
  recommended_environment:
    DOCUMENT_DOWNLOAD_TTL_SECONDS: "300"
    ARTIFACT_DOWNLOAD_TTL_SECONDS: "300"
  note: >-
    These are Backend deployment values. Frontend consumes expiresAt and does
    not assume a fixed TTL.

analytics:
  first_uat_scope: excluded
  emission_enabled: false
  provider: pending_product_decision
  uat_destination_id: pending
  production_destination_id: pending
  requirements:
    - "UAT and Production destinations must be distinct."
    - "PUBLIC_ANALYTICS_ID must identify the destination for the active environment."
    - "Provider integration must pass events through shared/analytics/privacy.ts."
    - "Tokens, cookies, signed URLs, storage keys, and URL queries must never be emitted."

release:
  uat_exists: false
  production_signoff_claimed: false
  release_tag_allowed: false

first_uat_scope:
  included:
    - "Wave 1 authentication and reviewer authority controls"
    - "Wave 2 asynchronous run state machine"
    - "Wave 3 same-origin deployment and runtime configuration"
    - "Wave 4 campaign files and release-quality gates"
  excluded:
    - "Analytics emission until provider and separate destination IDs are supplied"
    - "Legacy weekly, anomaly, tweak, and tweak-approval workspaces"
  legacy_workspace_flag:
    name: legacyPerformanceWorkspaces
    default: false
    enable_only_after:
      - "The legacy Backend contracts are versioned and checksummed."
      - "The real adapters are verified against those contracts."
      - "Browser authorization and async behavior tests pass."
